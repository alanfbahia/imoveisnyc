name: Cruzar nomes com Receita Federal - BigQuery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 15 * *'

permissions:
  contents: write

jobs:
  crossmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar cliente BigQuery
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery

      - name: Cruzar proprietários NYC com QSA atualizado
        run: python scripts/cruza_receita_bigquery.py

      - name: Publicar resultado no mapa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receita_matches.js
          if git diff --cached --quiet; then
            echo "Sem alterações no cruzamento"
          else
            git commit -m "Atualiza cruzamento RFB via Base dos Dados BigQuery"
            git pull --rebase origin main
            git push
          fi
